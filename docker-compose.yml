name: order-fulfillment-system

networks:
  fulfillment-net:
    driver: bridge

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    networks: [fulfillment-net]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks: [fulfillment-net]
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillment_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    container_name: dynamodb-local
    networks: [fulfillment-net]
    ports: ["8000:8000"]
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    networks: [fulfillment-net]
    ports: ["8081:8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-localdevpassword}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: ["start-dev", "--import-realm"]

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: mailpit
    networks: [fulfillment-net]
    ports: ["1025:1025", "8025:8025"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    networks: [fulfillment-net]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    networks: [fulfillment-net]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    container_name: order-service
    networks: [fulfillment-net]
    ports: ["18081:8081"]
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    container_name: inventory-service
    networks: [fulfillment-net]
    ports: ["8082:8082"]
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      dynamodb-local: { condition: service_started }
      kafka: { condition: service_started }

  fulfillment-service:
    build: { context: ., dockerfile: fulfillment-service/Dockerfile }
    container_name: fulfillment-service
    networks: [fulfillment-net]
    ports: ["8083:8083"]
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  alert-service:
    build: { context: ., dockerfile: alert-service/Dockerfile }
    container_name: alert-service
    networks: [fulfillment-net]
    ports: ["8084:8084"]
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      mailpit: { condition: service_started }
      kafka: { condition: service_started }

  insight-service:
    build: { context: ., dockerfile: insight-service/Dockerfile }
    container_name: insight-service
    networks: [fulfillment-net]
    ports: ["8085:8085"]

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    container_name: api-gateway
    networks: [fulfillment-net]
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: "8080"
      ORDER_SERVICE_HOST: order-service
      FULFILLMENT_SERVICE_HOST: fulfillment-service
      INSIGHT_SERVICE_HOST: insight-service
    depends_on:
      - order-service
      - fulfillment-service
      - insight-service
      - keycloak
