global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "order-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]
  - job_name: "inventory-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8082"]
  - job_name: "fulfillment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fulfillment-service:8083"]
  - job_name: "alert-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["alert-service:8084"]
  - job_name: "insight-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["insight-service:8085"]
  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
