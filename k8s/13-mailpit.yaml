apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: orders
spec:
  selector: {app: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: http, port: 8025, targetPort: 8025}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailpit}
  template:
    metadata:
      labels: {app: mailpit}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.20
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 8025}
            periodSeconds: 5
