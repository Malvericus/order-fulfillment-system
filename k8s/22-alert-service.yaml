apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: orders
spec:
  selector: {app: alert-service}
  ports:
    - {name: http, port: 8084, targetPort: 8084}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-service}
  template:
    metadata:
      labels: {app: alert-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: alert-service
          # Built locally and loaded into kind (see PLAN.md). Use a fixed tag, never :latest:
          # :latest defaults to imagePullPolicy Always, which fails for images that only exist locally.
          image: alert-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8084}
          envFrom:
            - configMapRef: {name: app-config}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # Spring Boot + Kafka takes a while to start; the startup probe holds off liveness until then.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            periodSeconds: 5
            failureThreshold: 36
          # Liveness = "is the JVM wedged?" (never depends on Postgres/Kafka, or a DB outage restarts every pod).
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            periodSeconds: 15
            failureThreshold: 3
          # Readiness = "should this pod receive traffic?"
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8084}
            periodSeconds: 10
            failureThreshold: 3
