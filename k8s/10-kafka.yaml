# Single-node Kafka in KRaft mode (broker + controller in one pod), same image as docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: orders
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: orders
spec:
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: orders
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # A Service called "kafka" makes Kubernetes inject KAFKA_PORT=tcp://... into pods, which collides
      # with Kafka's own KAFKA_* config. Turn service-link env vars off.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000   # the apache/kafka image runs as uid 1000; lets it write to the volume
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - {name: broker, containerPort: 9092}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            # 3 partitions per auto-created topic, so a 2nd consumer replica actually receives work.
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m"}
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1Gi}
          startupProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
