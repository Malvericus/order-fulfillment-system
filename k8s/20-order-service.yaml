apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orders
spec:
  selector: {app: order-service}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: order-service
          # Built locally and loaded into kind (see PLAN.md). Use a fixed tag, never :latest:
          # :latest defaults to imagePullPolicy Always, which fails for images that only exist locally.
          image: order-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8081}
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_PASSWORD}}
            # Readiness also requires a working database connection for this service.
            - {name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE, value: "readinessState,db"}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # Spring Boot + Kafka takes a while to start; the startup probe holds off liveness until then.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 5
            failureThreshold: 36
          # Liveness = "is the JVM wedged?" (never depends on Postgres/Kafka, or a DB outage restarts every pod).
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 15
            failureThreshold: 3
          # Readiness = "should this pod receive traffic?"
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            periodSeconds: 10
            failureThreshold: 3
